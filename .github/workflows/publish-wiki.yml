name: Publish wiki

# Publishes docs/wiki/** to the repository's GitHub Wiki whenever they change on the default branch.
# One-time setup is described in docs/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check out the wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy pages into the wiki
        run: |
          # Mirror docs/wiki (pages, _Sidebar, _Footer, images). Keep wiki-repo/.git.
          rsync -a --delete --exclude '.git' docs/wiki/ wiki-repo/

      - name: Convert links for the GitHub Wiki
        run: |
          # In the repo, pages link to "Page-Name.md" so they work when browsing docs/wiki.
          # The Wiki wants "Page-Name" (no extension). Keep any #anchor.
          find wiki-repo -maxdepth 1 -name '*.md' -print0 \
            | xargs -0 sed -E -i 's/\]\(([A-Za-z0-9_-]+)\.md(#[^)]*)?\)/](\1\2)/g'

      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "Sync wiki from ${GITHUB_SHA::7}"
            git push
          fi
